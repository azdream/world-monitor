syntax = "proto3";

package worldmonitor.pharma.v1;

import "sebuf/http/annotations.proto";
import "worldmonitor/pharma/v1/list_drug_approvals.proto";
import "worldmonitor/pharma/v1/list_drug_pipeline.proto";

service PharmaService {
  option (sebuf.http.service_config) = {base_path: "/api/pharma/v1"};

  // ListDrugPipeline returns late-stage industry drug trials with an expected
  // regulatory decision window, filterable by modality and therapeutic area.
  rpc ListDrugPipeline(ListDrugPipelineRequest) returns (ListDrugPipelineResponse) {
    option (sebuf.http.config) = {path: "/list-drug-pipeline", method: HTTP_METHOD_GET};
  }

  // ListDrugApprovals returns recent original FDA approvals (NDA/BLA).
  rpc ListDrugApprovals(ListDrugApprovalsRequest) returns (ListDrugApprovalsResponse) {
    option (sebuf.http.config) = {path: "/list-drug-approvals", method: HTTP_METHOD_GET};
  }
}
