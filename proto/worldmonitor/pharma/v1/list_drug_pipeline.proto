syntax = "proto3";

package worldmonitor.pharma.v1;

import "sebuf/http/annotations.proto";

// Field vocabularies and the decision-window heuristic are documented in
// docs/panels/drug-pipeline.mdx; comments here are kept short because each one
// is emitted into the size-budgeted public OpenAPI bundle. Query parameters
// are the exception: tests/generated-api-description-guard.test.mjs requires
// each one to carry a description.
message DrugPipelineEntry {
  string nct_id = 1;
  string title = 2;
  string candidate = 3;
  repeated string interventions = 4;
  string sponsor = 5;
  string phase = 6;
  string status = 7;
  string modality = 8;
  string modality_source = 9;
  string therapeutic_area = 10;
  repeated string conditions = 11;
  string primary_completion_date = 12;
  bool primary_completion_actual = 13;
  // Estimated (YYYY-MM), not announced.
  string expected_decision_from = 14;
  string expected_decision_to = 15;
  bool novel = 16;
  int32 enrollment = 17;
  string source_url = 18;
  string parent_company = 19;
  string hq_country = 20;
}

message DrugApproval {
  string application_number = 1;
  string brand_name = 2;
  string generic_name = 3;
  string sponsor = 4;
  string approval_date = 5;
  string application_type = 6;
  string review_priority = 7;
  bool new_molecular_entity = 8;
  string modality = 9;
  string route = 10;
  string parent_company = 11;
}

message PipelineFacetCount {
  string key = 1;
  int32 count = 2;
}

message ListDrugPipelineRequest {
  // Drug type filter.
  string modality = 1 [(sebuf.http.query) = {name: "modality"}];
  // Therapeutic area filter.
  string therapeutic_area = 2 [(sebuf.http.query) = {name: "therapeutic_area"}];
  // Only unapproved candidates.
  bool novel_only = 3 [(sebuf.http.query) = {name: "novel_only"}];
  // Parent company filter.
  string company = 5 [(sebuf.http.query) = {name: "company"}];
  // Default 200, max 500.
  int32 limit = 4 [(sebuf.http.query) = {name: "limit"}];
}

message ListDrugPipelineResponse {
  repeated DrugPipelineEntry entries = 1;
  int32 total = 2;
  repeated PipelineFacetCount modality_counts = 3;
  repeated PipelineFacetCount area_counts = 4;
  string generated_at = 5;
  // Dataset unavailable; empty fields are not zero data.
  bool unavailable = 6;
  // CDER only; last 180 days.
  repeated DrugApproval approvals = 7;
  bool approvals_unavailable = 8;
  repeated PipelineFacetCount company_counts = 9;
}
