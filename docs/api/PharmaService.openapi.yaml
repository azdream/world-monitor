openapi: 3.1.0
info:
    title: PharmaService API
    version: 1.0.0
security:
    - WorldMonitorKey: []
    - ApiKeyHeader: []
servers:
    - url: https://api.worldmonitor.app
paths:
    /api/pharma/v1/list-drug-pipeline:
        get:
            tags:
                - PharmaService
            summary: ListDrugPipeline
            description: |-
                ListDrugPipeline returns late-stage industry drug trials with an expected
                 regulatory decision window, filterable by modality and therapeutic area.
            operationId: ListDrugPipeline
            parameters:
                - name: modality
                  in: query
                  description: Filter by modality value; empty = all.
                  required: false
                  example: "example"
                  schema:
                    type: string
                - name: therapeutic_area
                  in: query
                  description: Filter by therapeutic_area value; empty = all.
                  required: false
                  example: "example"
                  schema:
                    type: string
                - name: novel_only
                  in: query
                  description: When true, only entries whose candidate is not yet approved.
                  required: false
                  example: true
                  schema:
                    type: boolean
                - name: limit
                  in: query
                  description: Max entries to return (default 200, max 500).
                  required: false
                  example: 25
                  schema:
                    type: integer
                    format: int32
                - name: jmespath
                  in: query
                  description: |-
                    Optional JMESPath expression applied server-side to project or reduce the JSON response before it is returned (mirrors the MCP jmespath argument). Invalid expressions, expressions larger than 1024 UTF-8 bytes, or projections that exceed the 256 KB output cap return HTTP 400 with a {_jmespath_error, original_keys} envelope. Grammar and worked examples: https://www.worldmonitor.app/docs/mcp-jmespath.
                  required: false
                  example: "keys(@)"
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            example:
                                "areaCounts":
                                    - "count": 1
                                      "key": "example"
                                "entries":
                                    - "candidate": "2026-01-15"
                                      "conditions":
                                          - "example"
                                      "enrollment": 1
                                      "expectedDecisionFrom": "example"
                                      "expectedDecisionTo": "example"
                                "generatedAt": "2026-01-15T12:00:00Z"
                                "modalityCounts":
                                    - "count": 1
                                      "key": "example"
                                "total": 1
                            schema:
                                $ref: '#/components/schemas/ListDrugPipelineResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ValidationError'
                                    - $ref: '#/components/schemas/JmespathProjectionError'
                "401":
                    description: Missing or invalid API key.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UnauthorizedError'
                "403":
                    description: API access requires an active subscription (the API key's subscription is inactive or expired).
                    headers:
                        X-Billing-Verification:
                            description: Present when the 403 is a billing-provider-confirmed subscription lapse (value subscription_lapsed, matching the body `code`).
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ForbiddenError'
                "429":
                    description: Rate limit exceeded.
                    headers:
                        X-RateLimit-Limit:
                            description: Maximum requests allowed in the active rate-limit window.
                            schema:
                                type: string
                        X-RateLimit-Remaining:
                            description: Requests remaining in the active rate-limit window.
                            schema:
                                type: string
                        X-RateLimit-Reset:
                            description: Unix epoch milliseconds when the active rate-limit window resets.
                            schema:
                                type: string
                        Retry-After:
                            description: Seconds to wait before retrying the request.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/Error'
                                    - $ref: '#/components/schemas/RateLimitError'
                "503":
                    description: Service unavailable. Billing-verification responses include code and X-Billing-Verification; other gateway infrastructure failures use the generic GatewayError shape.
                    headers:
                        Retry-After:
                            description: Seconds to wait before retrying (1-60).
                            schema:
                                type: string
                        X-Billing-Verification:
                            description: Billing-verification state that produced this response (matches the body `code`).
                            schema:
                                type: string
                        X-Validation-Mode:
                            description: Present with value degraded when user API-key validation is temporarily unavailable.
                            schema:
                                type: string
                        X-RateLimit-Mode:
                            description: Present with value degraded when a fail-closed rate-limit dependency is unavailable.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/BillingVerificationError'
                                    - $ref: '#/components/schemas/GatewayError'
                default:
                    description: Gateway or handler error response.
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/Error'
                                    - $ref: '#/components/schemas/GatewayError'
    /api/pharma/v1/list-drug-approvals:
        get:
            tags:
                - PharmaService
            summary: ListDrugApprovals
            description: ListDrugApprovals returns recent original FDA approvals (NDA/BLA).
            operationId: ListDrugApprovals
            parameters:
                - name: jmespath
                  in: query
                  description: |-
                    Optional JMESPath expression applied server-side to project or reduce the JSON response before it is returned (mirrors the MCP jmespath argument). Invalid expressions, expressions larger than 1024 UTF-8 bytes, or projections that exceed the 256 KB output cap return HTTP 400 with a {_jmespath_error, original_keys} envelope. Grammar and worked examples: https://www.worldmonitor.app/docs/mcp-jmespath.
                  required: false
                  example: "keys(@)"
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            example:
                                "approvals":
                                    - "applicationNumber": "example"
                                      "applicationType": "all"
                                      "approvalDate": "2026-01-15"
                                      "brandName": "WorldMonitor Analyst"
                                      "genericName": "WorldMonitor Analyst"
                                "generatedAt": "2026-01-15T12:00:00Z"
                                "total": 1
                                "unavailable": false
                            schema:
                                $ref: '#/components/schemas/ListDrugApprovalsResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ValidationError'
                                    - $ref: '#/components/schemas/JmespathProjectionError'
                "401":
                    description: Missing or invalid API key.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UnauthorizedError'
                "403":
                    description: API access requires an active subscription (the API key's subscription is inactive or expired).
                    headers:
                        X-Billing-Verification:
                            description: Present when the 403 is a billing-provider-confirmed subscription lapse (value subscription_lapsed, matching the body `code`).
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ForbiddenError'
                "429":
                    description: Rate limit exceeded.
                    headers:
                        X-RateLimit-Limit:
                            description: Maximum requests allowed in the active rate-limit window.
                            schema:
                                type: string
                        X-RateLimit-Remaining:
                            description: Requests remaining in the active rate-limit window.
                            schema:
                                type: string
                        X-RateLimit-Reset:
                            description: Unix epoch milliseconds when the active rate-limit window resets.
                            schema:
                                type: string
                        Retry-After:
                            description: Seconds to wait before retrying the request.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/Error'
                                    - $ref: '#/components/schemas/RateLimitError'
                "503":
                    description: Service unavailable. Billing-verification responses include code and X-Billing-Verification; other gateway infrastructure failures use the generic GatewayError shape.
                    headers:
                        Retry-After:
                            description: Seconds to wait before retrying (1-60).
                            schema:
                                type: string
                        X-Billing-Verification:
                            description: Billing-verification state that produced this response (matches the body `code`).
                            schema:
                                type: string
                        X-Validation-Mode:
                            description: Present with value degraded when user API-key validation is temporarily unavailable.
                            schema:
                                type: string
                        X-RateLimit-Mode:
                            description: Present with value degraded when a fail-closed rate-limit dependency is unavailable.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/BillingVerificationError'
                                    - $ref: '#/components/schemas/GatewayError'
                default:
                    description: Gateway or handler error response.
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/Error'
                                    - $ref: '#/components/schemas/GatewayError'
components:
    securitySchemes:
        WorldMonitorKey:
            type: apiKey
            in: header
            name: X-WorldMonitor-Key
            description: User-issued WorldMonitor API key.
        ApiKeyHeader:
            type: apiKey
            in: header
            name: X-Api-Key
            description: Alias header for the WorldMonitor API key (X-WorldMonitor-Key).
    schemas:
        JmespathProjectionError:
            description: Returned when a REST jmespath projection is invalid or exceeds the expression/output byte limits.
            properties:
                _jmespath_error:
                    description: Projection error discriminator and details.
                    type: string
                original_keys:
                    description: Top-level keys or shape of the unprojected response.
                    items:
                        type: string
                    type: array
            required:
                - _jmespath_error
                - original_keys
            type: object
        UnauthorizedError:
            type: object
            properties:
                error:
                    type: string
                    description: Human-readable error message.
            required:
                - error
            description: Returned when the API key is missing, malformed, or lacks current API access.
        Error:
            type: object
            properties:
                message:
                    type: string
                    description: Error message (e.g., 'user not found', 'database connection failed')
            description: Error is returned when a handler encounters an error. It contains a simple error message that the developer can customize.
        BillingVerificationError:
            type: object
            description: "Returned with HTTP 503 when paid access cannot be confirmed right now: the billing provider is re-verifying a recently expired subscription, or the entitlement backend is unreachable. Retryable — honor Retry-After."
            properties:
                error:
                    type: string
                    description: Human-readable billing-verification failure reason.
                code:
                    type: string
                    enum:
                        - renewal_verification_pending
                        - renewal_verification_failed
                        - entitlement_verification_unavailable
                    description: Machine-readable billing-verification state, mirrored in the X-Billing-Verification response header.
                requiredTier:
                    type: integer
                    format: int32
                    description: Minimum entitlement tier required for this endpoint, when the denial came from a tier gate.
            required:
                - error
                - code
        InvalidRequestBodyError:
            type: object
            description: Returned when a JSON POST request body is empty or malformed.
            properties:
                message:
                    type: string
                    description: Invalid request body
            required:
                - message
        GatewayError:
            type: object
            description: Returned by gateway infrastructure errors before an RPC handler runs, such as origin, routing, method, authentication, or quota checks.
            properties:
                error:
                    oneOf:
                        - type: string
                        - type: object
                          additionalProperties: true
                    description: Gateway error reason or structured gateway failure details.
            required:
                - error
        RateLimitError:
            type: object
            description: Returned when a gateway or handler rate limit rejects the request.
            properties:
                error:
                    type: string
                    description: Human-readable rate-limit failure reason.
            required:
                - error
        ForbiddenError:
            type: object
            properties:
                error:
                    type: string
                    description: Human-readable entitlement failure reason.
                code:
                    type: string
                    enum:
                        - subscription_lapsed
                    description: Machine-readable denial code, present when the 403 is a billing-provider-confirmed subscription lapse (mirrored in the X-Billing-Verification response header).
                requiredTier:
                    type: integer
                    format: int32
                    description: Minimum entitlement tier required for this endpoint.
                currentTier:
                    type: integer
                    format: int32
                    description: Caller entitlement tier when known.
                planKey:
                    type: string
                    description: Caller plan key when known.
            required:
                - error
            description: Returned when a PRO-gated endpoint denies access because the caller has no resolved authenticated user, entitlements cannot be verified, or the caller lacks the required entitlement tier.
        FieldViolation:
            type: object
            properties:
                field:
                    type: string
                    description: The field path that failed validation (e.g., 'user.email' for nested fields). For header validation, this will be the header name (e.g., 'X-API-Key')
                description:
                    type: string
                    description: Human-readable description of the validation violation (e.g., 'must be a valid email address', 'required field missing')
            required:
                - field
                - description
            description: FieldViolation describes a single validation error for a specific field.
        ValidationError:
            type: object
            properties:
                violations:
                    type: array
                    items:
                        $ref: '#/components/schemas/FieldViolation'
                    description: List of validation violations
            required:
                - violations
            description: ValidationError is returned when request validation fails. It contains a list of field violations describing what went wrong.
        ListDrugPipelineRequest:
            type: object
            properties:
                modality:
                    type: string
                    description: Filter by modality value; empty = all.
                therapeuticArea:
                    type: string
                    description: Filter by therapeutic_area value; empty = all.
                novelOnly:
                    type: boolean
                    description: When true, only entries whose candidate is not yet approved.
                limit:
                    type: integer
                    format: int32
                    description: Max entries to return (default 200, max 500).
        ListDrugPipelineResponse:
            type: object
            properties:
                entries:
                    type: array
                    items:
                        $ref: '#/components/schemas/DrugPipelineEntry'
                total:
                    type: integer
                    format: int32
                    description: Entries matching the filters before the limit was applied.
                modalityCounts:
                    type: array
                    items:
                        $ref: '#/components/schemas/PipelineFacetCount'
                areaCounts:
                    type: array
                    items:
                        $ref: '#/components/schemas/PipelineFacetCount'
                generatedAt:
                    type: string
                    description: ISO-8601 timestamp of the seed run that produced the data.
                unavailable:
                    type: boolean
                    description: |-
                        True when the seed-backed dataset is unavailable; empty payload fields are
                         graceful degradation, not confirmed zero data.
        DrugPipelineEntry:
            type: object
            properties:
                nctId:
                    type: string
                    description: ClinicalTrials.gov registry identifier (e.g. "NCT01234567").
                title:
                    type: string
                    description: Brief trial title.
                candidate:
                    type: string
                    description: |-
                        Lead investigational intervention (first intervention that is not a
                         placebo and, when one exists, not an already-approved drug).
                interventions:
                    type: array
                    items:
                        type: string
                        description: All non-placebo intervention names in the trial.
                sponsor:
                    type: string
                    description: Lead sponsor name.
                phase:
                    type: string
                    description: 'Trial phase: "PHASE3" | "PHASE2_PHASE3".'
                status:
                    type: string
                    description: ClinicalTrials.gov overall status (e.g. "RECRUITING").
                modality:
                    type: string
                    description: |-
                        Drug modality: "small_molecule" | "antibody" | "adc" | "cell_therapy" |
                         "gene_therapy" | "rna" | "vaccine" | "peptide_protein" | "other".
                modalitySource:
                    type: string
                    description: 'How modality was determined: "chembl" | "name" | "intervention_type".'
                therapeuticArea:
                    type: string
                    description: |-
                        Therapeutic area: "oncology" | "metabolic" | "neurology" | "cardiovascular" |
                         "immunology" | "infectious" | "respiratory" | "psychiatry" | "hematology" |
                         "other".
                conditions:
                    type: array
                    items:
                        type: string
                        description: Conditions studied, as registered.
                primaryCompletionDate:
                    type: string
                    description: Primary completion date, "YYYY-MM-DD" or "YYYY-MM" as registered.
                primaryCompletionActual:
                    type: boolean
                    description: True when the primary completion date is actual rather than anticipated.
                expectedDecisionFrom:
                    type: string
                    description: |-
                        Earliest estimated month of a regulatory decision, "YYYY-MM". This is a
                         heuristic (primary completion + filing lag + review clock), not a
                         regulator- or sponsor-announced date.
                expectedDecisionTo:
                    type: string
                    description: Latest estimated month of a regulatory decision, "YYYY-MM".
                novel:
                    type: boolean
                    description: |-
                        True when the candidate is not yet an approved drug (new drug rather than
                         a label expansion of an approved one).
                enrollment:
                    type: integer
                    format: int32
                    description: Planned or actual enrollment (0 = unknown).
                sourceUrl:
                    type: string
                    description: ClinicalTrials.gov study URL.
            description: |-
                DrugPipelineEntry is one late-stage clinical trial and its estimated
                 regulatory decision window.
        PipelineFacetCount:
            type: object
            properties:
                key:
                    type: string
                    description: Category key (a modality or therapeutic_area value).
                count:
                    type: integer
                    format: int32
                    description: Entries in this category.
            description: |-
                PipelineFacetCount is the number of pipeline entries in one category,
                 computed before modality/area filters are applied.
        ListDrugApprovalsRequest:
            type: object
        ListDrugApprovalsResponse:
            type: object
            properties:
                approvals:
                    type: array
                    items:
                        $ref: '#/components/schemas/DrugApproval'
                total:
                    type: integer
                    format: int32
                    description: Number of approvals returned.
                generatedAt:
                    type: string
                    description: ISO-8601 timestamp of the seed run that produced the data.
                unavailable:
                    type: boolean
                    description: |-
                        True when the seed-backed dataset is unavailable; empty payload fields are
                         graceful degradation, not confirmed zero data.
        DrugApproval:
            type: object
            properties:
                applicationNumber:
                    type: string
                    description: FDA application number (e.g. "NDA215123", "BLA761234").
                brandName:
                    type: string
                    description: Brand name (may be empty shortly after approval).
                genericName:
                    type: string
                    description: Generic / active ingredient name.
                sponsor:
                    type: string
                    description: Applicant name.
                approvalDate:
                    type: string
                    description: Approval date, "YYYY-MM-DD".
                applicationType:
                    type: string
                    description: 'Application type: "NDA" | "BLA".'
                reviewPriority:
                    type: string
                    description: 'Review priority as reported by FDA: "PRIORITY" | "STANDARD" | "".'
                newMolecularEntity:
                    type: boolean
                    description: True for a new molecular entity (NDA Type 1) or any original BLA.
                modality:
                    type: string
                    description: Drug modality (same vocabulary as DrugPipelineEntry.modality).
                route:
                    type: string
                    description: Administration route (e.g. "ORAL"), when known.
            description: DrugApproval is one original FDA marketing approval (NDA or BLA).
